apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    namespace = "com.bachduong.remixvideo"
    compileSdk = rootProject.ext.compileSdkVersion

    signingConfigs {
        release {
            def ksFile = file('app-signing.keystore')
            if (ksFile.exists()) {
                storeFile ksFile
                storePassword 'bachduong123'
                keyAlias 'bachremix'
                keyPassword 'bachduong123'
            }
        }
        debug {
            def ksFile = file('app-signing.keystore')
            if (ksFile.exists()) {
                storeFile ksFile
                storePassword 'bachduong123'
                keyAlias 'bachremix'
                keyPassword 'bachduong123'
            }
        }
    }

    defaultConfig {
        applicationId "com.bachduong.remixvideo"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode Integer.parseInt(System.getenv("VERSION_CODE") ?: "100")
        versionName (System.getenv("VERSION_NAME") ?: "1.0.0")
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        debug {
            if (signingConfigs.debug.storeFile != null && signingConfigs.debug.storeFile.exists()) {
                signingConfig signingConfigs.debug
            }
        }
        release {
            if (signingConfigs.release.storeFile != null && signingConfigs.release.storeFile.exists()) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    packaging {
        jniLibs {
            useLegacyPackaging = true
            pickFirsts += ['**/libc++_shared.so', '**/libgomp.so', '**/libomp.so', '**/libonnxruntime.so']
        }
        resources {
            excludes += ['META-INF/INDEX.LIST', 'META-INF/DEPENDENCIES', 'META-INF/LICENSE', 'META-INF/NOTICE']
        }
    }
    packagingOptions {
        pickFirst '**/libc++_shared.so'
        pickFirst '**/libgomp.so'
        pickFirst '**/libomp.so'
        pickFirst '**/libonnxruntime.so'
        pickFirst 'lib/arm64-v8a/libc++_shared.so'
        pickFirst 'lib/armeabi-v7a/libc++_shared.so'
        pickFirst 'lib/x86/libc++_shared.so'
        pickFirst 'lib/x86_64/libc++_shared.so'
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')

    // FFmpegKit Android Native - High performance native video/audio processing & subtitle burning (active maintained drop-in replacement)
    implementation 'dev.ffmpegkit-maintained:ffmpeg-kit-full-gpl:8.1.7'

    // Microsoft ONNX Runtime Android for offline VieNeu-TTS v3 Turbo speech synthesis
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.20.0'

    // Native yt-dlp + Python + QuickJS + Aria2c for on-device multi-platform video extraction (uses existing FFmpegKit for muxing)
    implementation 'io.github.junkfood02.youtubedl-android:library:0.18.1'
    implementation 'io.github.junkfood02.youtubedl-android:aria2c:0.18.1'

    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
